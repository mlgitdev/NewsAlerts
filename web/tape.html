<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tape — Small Cap High of Day Momentum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="css/app.css?v=7">
</head>
<body class="tape-only">
  <div class="app">
    <div id="tape-host"></div>
    <div class="version-corner" id="corner-version-badge" title="NewsAlerts (SemVer 2.0.0)">
      <span class="ver-dot"></span>
      <span class="ver-text" id="corner-version-text"></span>
    </div>
  </div>

  <script src="js/util.js?v=5"></script>
  <script src="js/tape.js?v=5"></script>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      await App.ready;
      const state = await App.api().get_state();
      App.config = state.config;
      App.sounds = state.sounds;
      App.version = state.version || "";
      const verEl = document.getElementById("corner-version-text");
      if (verEl && App.version) verEl.textContent = App.version.startsWith("v") ? App.version : `v${App.version}`;
      if (App.config.ui && App.config.ui.font_size) {
        document.documentElement.style.setProperty("--fs", App.config.ui.font_size + "px");
      }
      document.body.classList.toggle("bright", !!(App.config.ui && App.config.ui.tape_bright));

      Tape.mount(document.getElementById("tape-host"), { popout: true });
      if (state.tape) Tape.load(state.tape);

      App.banSymbol = async function (symbol) {
        const sym = String(symbol || "").split(":").pop().trim().toUpperCase();
        if (!sym) return;
        App.config.banned_symbols = App.config.banned_symbols || [];
        if (!App.config.banned_symbols.includes(sym)) {
          App.config.banned_symbols.push(sym);
          await App.api().ban_symbol(sym);
          Tape.renderAll();
        }
      };

      App.unbanSymbol = async function (symbol) {
        const sym = String(symbol || "").split(":").pop().trim().toUpperCase();
        if (!sym) return;
        App.config.banned_symbols = App.config.banned_symbols || [];
        const idx = App.config.banned_symbols.indexOf(sym);
        if (idx !== -1) {
          App.config.banned_symbols.splice(idx, 1);
          await App.api().unban_symbol(sym);
          Tape.renderAll();
        }
      };

      let lastEventId = state.last_event_id || 0;
      while (true) {
        try {
          const events = await App.api().poll_events(lastEventId);
          if (events && events.length) {
            for (const ev of events) {
              if (ev.id > lastEventId) lastEventId = ev.id;
              App.on(ev.event, ev.payload);
            }
          }
        } catch (e) {
          await new Promise((r) => setTimeout(r, 1000));
        }
        await new Promise((r) => setTimeout(r, 350));
      }
    });
  </script>
</body>
</html>
