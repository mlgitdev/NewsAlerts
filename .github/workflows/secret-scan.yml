name: Secret Scanning & Leak Detection

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan-secrets:
    name: Secret & Credential Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit for Forbidden Secret Files
        run: |
          echo "Scanning working tree and git history for forbidden secret files..."
          FORBIDDEN_FILES=$(git ls-files | grep -E "(^|/)keys\.toml$|(^|/)secrets\.toml$|(^|/)secrets/|(^|/)\.env$" || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::CRITICAL SECURITY FAILURE: Forbidden secret file(s) found in git index:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "✓ No secret files found in repository tree."

      - name: Scan for High-Entropy Credentials and API Keys
        run: |
          echo "Checking codebase for accidental inline secrets (API keys, bot tokens)..."
          FAIL=0
          # Check for Telegram bot token pattern (e.g. 123456789:ABCdef...)
          if git grep -EI "[0-9]{8,10}:[a-zA-Z0-9_-]{35}" -- ':!scratch' ':!tests'; then
            echo "::error::Potential Telegram bot token detected!"
            FAIL=1
          fi
          # Check for Alpaca Key pattern (e.g. PK... or AK...)
          if git grep -EI "PK[A-Z0-9]{18}|AK[A-Z0-9]{18}" -- ':!scratch' ':!tests'; then
            echo "::error::Potential Alpaca Key ID detected!"
            FAIL=1
          fi
          if [ $FAIL -ne 0 ]; then
            exit 1
          fi
          echo "✓ No high-entropy API keys detected."

      - name: Gitleaks Security Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
