name: Release Automation & Multi-OS Packaging

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v2.4.0)"
        required: true
        default: "v2.4.0"

permissions:
  contents: write
  issues: write

jobs:
  check-release:
    name: Check if Release Needed
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version_tag: ${{ steps.check.outputs.version_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
            echo "Workflow dispatch requested release for $TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version_tag=$TAG" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            echo "Tag pushed: $TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version_tag=$TAG" >> $GITHUB_OUTPUT
          else
            # Push to main branch
            VERSION=$(cat VERSION | tr -d '[:space:]')
            TAG="v$VERSION"
            echo "Checking if release for $TAG exists on GitHub..."
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists on GitHub. Skipping release build."
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "version_tag=$TAG" >> $GITHUB_OUTPUT
            else
              echo "Release $TAG does not exist yet! Proceeding with release build."
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version_tag=$TAG" >> $GITHUB_OUTPUT
            fi
          fi

  build-windows:
    name: Package Windows Release (x64)
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Build Standalone Windows Executable
        run: |
          powershell -File .\build.ps1 -Task build

      - name: Create Windows Release Archive
        run: |
          mkdir release-win
          Copy-Item "dist\NewsAlerts.exe" -Destination "release-win\"
          Copy-Item "README.md" -Destination "release-win\"
          Copy-Item "assets\hero.jpg" -Destination "release-win\"
          Compress-Archive -Path "release-win\*" -DestinationPath "NewsAlerts-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: NewsAlerts-Windows-x64.zip

  build-macos:
    name: Package macOS Release (arm64)
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create macOS Release Archive
        run: |
          mkdir -p release-macos/NewsAlerts
          cp -r app web assets run.sh install.sh requirements.txt run_app.py README.md release-macos/NewsAlerts/
          chmod +x release-macos/NewsAlerts/*.sh
          tar -czvf NewsAlerts-macOS-arm64.tar.gz -C release-macos NewsAlerts

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: NewsAlerts-macOS-arm64.tar.gz

  build-linux:
    name: Package Linux Release (x64)
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Linux Release Archive
        run: |
          mkdir -p release-linux/NewsAlerts
          cp -r app web assets run.sh install.sh requirements.txt run_app.py README.md release-linux/NewsAlerts/
          chmod +x release-linux/NewsAlerts/*.sh
          tar -czvf NewsAlerts-Linux-x64.tar.gz -C release-linux NewsAlerts

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: NewsAlerts-Linux-x64.tar.gz

  verify-and-publish:
    name: Verify Packages & Publish Release
    needs: [check-release, build-windows, build-macos, build-linux]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Determine Release Version & Body
        id: release-info
        run: |
          TAG="${{ needs.check-release.outputs.version_tag }}"
          if [[ -z "$TAG" || "$TAG" == "main" ]]; then
            if [ -f "VERSION" ]; then
              TAG="v$(cat VERSION | tr -d '[:space:]')"
            else
              TAG="${{ github.event.inputs.version || 'v2.7.1' }}"
            fi
          fi
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV

          # Look for matching release notes file
          NOTES_FILE="docs/releases/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Found release notes at $NOTES_FILE"
            echo "NOTES_PATH=$NOTES_FILE" >> $GITHUB_ENV
          elif [ -f "docs/releases/v2.7.0.md" ]; then
            echo "Using docs/releases/v2.7.0.md as fallback notes"
            echo "NOTES_PATH=docs/releases/v2.7.0.md" >> $GITHUB_ENV
          else
            echo "NOTES_PATH=" >> $GITHUB_ENV
          fi

      - name: Execute Package Verification Gate
        id: package-gate
        run: |
          echo "Running Package Verification Gate on all release artifacts..."
          python3 scripts/verify-packages.py --artifacts-dir release-artifacts

      - name: Handle Package Verification Failure (Rollback, Delete Tag, Open Issue)
        if: failure() && steps.package-gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error::CRITICAL: Package Verification Gate Failed! Executing fail-safe rollback protocol."
          TAG="${{ env.VERSION_TAG }}"

          # 1. Delete remote git tag if triggered by tag push
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "Deleting remote tag '$TAG'..."
            git push origin --delete "$TAG" || echo "Tag deletion completed or not found"
          fi

          # 2. Revert main to last good commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          echo "Reverting commit ${{ github.sha }} on main..."
          git revert --no-edit "${{ github.sha }}" || echo "Revert conflict or already handled"
          git push origin main || echo "Push to main attempted"

          # 3. Open Critical GitHub Incident Issue
          gh issue create \
            --title "🚨 Critical: Package Verification Failed for ${TAG} [Rollback Executed]" \
            --body "## 🚨 Critical Release Package Verification Failure & Automated Rollback

          **Failed Version Tag:** \`${TAG}\`
          **Failed Commit SHA:** \`${{ github.sha }}\`
          **Triggered By:** \`${{ github.actor }}\`
          **Workflow Run:** [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### 🛡️ Automated Remediation Actions Taken:
          - ❌ **Release Blocked**: Failed package artifacts were **NOT** published to GitHub Releases.
          - 🗑️ **Tag Deleted**: Remote git tag \`${TAG}\` was removed from the repository.
          - ⏪ **Branch Reverted**: \`main\` branch was reverted to prevent distribution of broken artifacts.
          - 📋 **Incident Issue**: Opened automatically for mandatory review by @${{ github.repository_owner }}.

          ### Required Actions:
          1. Review workflow run logs to diagnose package verification failure reasons.
          2. Resolve the build/packaging issue in an isolated git worktree (\`feat/\` or \`fix/\`).
          3. Verify packages locally with \`build.ps1 -Task verify-packages\` before opening a new PR."

          exit 1

      - name: Flatten Validated Artifacts
        if: success()
        run: |
          mkdir -p dist-release
          find release-artifacts/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist-release/ \;
          if [ -n "$NOTES_PATH" ]; then
            cp "$NOTES_PATH" "dist-release/ReleaseNotes-${VERSION_TAG}.md"
          fi
          ls -la dist-release/

      - name: Publish Official GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "NewsAlerts ${{ env.VERSION_TAG }}"
          body_path: ${{ env.NOTES_PATH }}
          files: dist-release/*
          draft: false
          prerelease: false

      - name: Synchronize GitHub Wiki Documentation
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_wiki.py || echo "Wiki sync step completed or skipped"
