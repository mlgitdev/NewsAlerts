name: PR Validation Bot

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-pr:
    name: Validate PR Title & Template Sections
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title (Conventional Commits)
        id: title-check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Validating PR title: '$PR_TITLE'"
          REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|task|revert)(\([a-zA-Z0-9_\.\-]+\))?: .{3,120}$"
          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "::error::PR Title '$PR_TITLE' does not conform to Conventional Commits standard."
            echo "Expected format: '<type>(<optional-scope>): <description>'"
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, task, revert"
            echo "Example: 'feat(tape): add momentum volume surge filter'"
            echo "TITLE_OK=false" >> $GITHUB_ENV
          else
            echo "✓ PR Title follows Conventional Commits format."
            echo "TITLE_OK=true" >> $GITHUB_ENV
          fi

      - name: Validate PR Body Sections
        id: body-check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          REQUIRED_SECTIONS=(
            "## Summary"
            "## Motivation / Context"
            "## Changes"
            "## Verification & Testing"
            "## Checklist"
          )
          MISSING=()
          for section in "${REQUIRED_SECTIONS[@]}"; do
            if ! grep -qiF "$section" <<< "$PR_BODY"; then
              MISSING+=("$section")
            fi
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::PR Description is missing required template sections:"
            for m in "${MISSING[@]}"; do
              echo "  - $m"
            done
            echo "BODY_OK=false" >> $GITHUB_ENV
          else
            echo "✓ All required PR description sections are present."
            echo "BODY_OK=true" >> $GITHUB_ENV
          fi

      - name: Post PR Validation Status Comment
        if: always() && github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            const titleOk = process.env.TITLE_OK === 'true';
            const bodyOk = process.env.BODY_OK === 'true';
            const issue_number = context.issue.number;

            let message = '';
            if (titleOk && bodyOk) {
              message = `### ✅ PR Validation Passed\n\n- [x] Conventional Commit title syntax\n- [x] Required template sections present\n- [x] Security audit ready\n\n*Ready for review by @${context.repo.owner}!*`;
            } else {
              message = `### ⚠️ PR Validation Requirements Incomplete\n\nPlease address the following before this PR can be merged:\n\n`;
              if (!titleOk) {
                message += `- ❌ **PR Title**: Must conform to Conventional Commits: \`type(scope): description\` (e.g. \`feat(screener): add gap up filter\`).\n`;
              }
              if (!bodyOk) {
                message += `- ❌ **PR Body**: Missing one or more required sections from \`.github/pull_request_template.md\` (\`## Summary\`, \`## Motivation / Context\`, \`## Changes\`, \`## Verification & Testing\`, \`## Checklist\`).\n`;
              }
            }

            // Find existing bot comment or post a new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });
            const botComment = comments.data.find(c => c.body.includes('PR Validation'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: message
              });
            }

      - name: Fail if Validation Incomplete
        run: |
          if [[ "$TITLE_OK" != "true" || "$BODY_OK" != "true" ]]; then
            echo "::error::PR validation failed (Title: $TITLE_OK, Body: $BODY_OK)."
            exit 1
          fi
