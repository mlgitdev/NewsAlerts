name: Multi-OS CI & Execution Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test-and-build-windows:
    name: Windows x64 Build & Validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Syntax Compilation
        run: |
          python -m compileall app run_app.py

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build Standalone Windows Executable (NewsAlerts.exe)
        run: |
          powershell -File .\build.ps1 -Task build

      - name: Verify Executable Integrity & Embedded Custom Icon
        run: |
          python scripts/verify-packages.py --exe dist/NewsAlerts.exe
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon("dist\NewsAlerts.exe")
          Write-Host "Successfully verified embedded executable icon ($($ico.Width)x$($ico.Height))"

  test-and-build-macos:
    name: macOS arm64 Build & Validation
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Syntax Compilation
        run: |
          python3 -m compileall app run_app.py

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Package macOS Release & Verify
        run: |
          mkdir -p release-macos/NewsAlerts
          cp -r app web assets run.sh install.sh requirements.txt run_app.py README.md release-macos/NewsAlerts/
          chmod +x release-macos/NewsAlerts/*.sh
          tar -czvf NewsAlerts-macOS-arm64.tar.gz -C release-macos NewsAlerts
          python3 scripts/verify-packages.py --macos-tar NewsAlerts-macOS-arm64.tar.gz

  test-and-build-linux:
    name: Linux x64 Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System WebKit2GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 gir1.2-gtk-3.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Syntax Compilation
        run: |
          python3 -m compileall app run_app.py

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Package Linux Release & Verify
        run: |
          mkdir -p release-linux/NewsAlerts
          cp -r app web assets run.sh install.sh requirements.txt run_app.py README.md release-linux/NewsAlerts/
          chmod +x release-linux/NewsAlerts/*.sh
          tar -czvf NewsAlerts-Linux-x64.tar.gz -C release-linux NewsAlerts
          python3 scripts/verify-packages.py --linux-tar NewsAlerts-Linux-x64.tar.gz

  sync-wiki:
    name: Synchronize GitHub Wiki Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Wiki Documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_wiki.py

