name: Multi-OS CI & Execution Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build-windows:
    name: Windows x64 Build & Validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Syntax & Import Validation
        run: |
          python -m py_compile app/*.py run_app.py

      - name: Run Unit Tests
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import app.main, app.config, app.sounds, app.telegram; print('[OK] Core modules imported successfully')"

      - name: Build Standalone Windows Executable (NewsAlerts.exe)
        run: |
          powershell -File .\build.ps1 -Task build

      - name: Verify Executable & Custom Icon
        run: |
          if (!(Test-Path "dist\NewsAlerts.exe")) {
            Write-Error "dist\NewsAlerts.exe not found!"
            exit 1
          }
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon("dist\NewsAlerts.exe")
          Write-Host "Successfully verified embedded executable icon ($($ico.Width)x$($ico.Height))"

  test-and-build-macos:
    name: macOS arm64 Build & Validation
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Syntax & Import Validation
        run: |
          python3 -m py_compile app/*.py run_app.py

      - name: Verify macOS Launcher & ICNS Icon
        run: |
          chmod +x run.sh install.sh
          test -f assets/icon.icns
          python3 -c "import sys; sys.path.insert(0, '.'); import app.main; print('[OK] macOS environment verified')"

  test-and-build-linux:
    name: Linux x64 Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System WebKit2GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 gir1.2-gtk-3.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Syntax & Import Validation
        run: |
          python3 -m py_compile app/*.py run_app.py

      - name: Verify Linux Desktop Integration & install.sh
        run: |
          chmod +x run.sh install.sh
          test -f assets/NewsAlerts.desktop
          test -f assets/app_icon_transparent.png
          python3 -c "import sys; sys.path.insert(0, '.'); import app.config, app.sounds; print('[OK] Linux configuration & sound handlers verified')"
